name: Weekly dependency check

# Runs the CI jobs without a push, so that a break caused by a new release of
# a dependency is noticed.
#
# GitHub disables scheduled workflows after 60 days without repository
# activity and does not turn them back on by itself. Re-enable this one with
# the "Enable workflow" button on its Actions page or with
# `gh workflow enable weekly.yml`. The schedule has its own file so that this
# cannot touch the push and pull-request runs of ci.yml.
on:
  schedule:
    # Mondays 04:17 UTC
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
